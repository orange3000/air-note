<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>대기관리기술사 마스터 서브노트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#3b82f6', 600: '#2563eb' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .blind-blur { filter: blur(5.5px); transition: filter 0.2s ease; cursor: pointer; user-select: none; }
    .blind-blur:hover { filter: blur(2px); }
    .blind-blur.revealed { filter: none !important; user-select: text; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased">

  <!-- 1. 보안 인증 화면 -->
  <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950 p-4">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-3xl p-7 shadow-2xl backdrop-blur-xl">
      <div class="text-center mb-6">
        <div class="inline-flex p-3.5 bg-blue-600/10 text-blue-400 rounded-2xl mb-3 border border-blue-500/20">
          <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <h1 class="text-xl font-bold text-white tracking-tight">대기관리기술사 마스터</h1>
        <p class="text-xs text-slate-400 mt-1">인증 핀번호(4자리)를 입력하세요</p>
      </div>
      
      <div class="space-y-4">
        <div>
          <input type="password" id="pin-input" maxlength="8" placeholder="PIN 번호 입력" 
                 class="w-full px-4 py-3.5 bg-slate-950 border border-slate-800 rounded-xl text-center text-xl tracking-widest text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="button" onclick="checkPin()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/20 cursor-pointer">
          <span>대시보드 접속</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </div>
      <p id="login-err" class="text-rose-400 text-xs text-center mt-3 hidden">비밀번호가 일치하지 않습니다.</p>
    </div>
  </div>

  <!-- 2. 메인 대시보드 화면 -->
  <div id="main-app" class="hidden flex-1 flex flex-col md:flex-row h-screen overflow-hidden">
    
    <!-- 좌측 사이드바 -->
    <aside class="w-full md:w-72 bg-slate-900 border-b md:border-b-0 md:border-r border-slate-800 flex md:flex-col justify-between p-4 shrink-0 shadow-xl">
      <div class="space-y-4 overflow-y-auto hide-scrollbar">
        <div class="flex items-center justify-between px-1 py-2">
          <div class="flex items-center gap-2.5">
            <div class="p-2.5 bg-blue-600 rounded-xl text-white shadow-lg shadow-blue-500/20">
              <i data-lucide="award" class="w-5 h-5"></i>
            </div>
            <div>
              <h2 class="text-sm font-bold text-white tracking-tight leading-tight">대기관리기술사</h2>
              <span class="text-[10px] text-blue-400 font-semibold tracking-wider">ALL-IN-ONE MASTER DB</span>
            </div>
          </div>
        </div>

        <!-- 탭 네비게이션 -->
        <nav class="flex md:flex-col gap-1.5 overflow-x-auto hide-scrollbar">
          <button type="button" onclick="switchTab('tab-10p')" id="btn-tab-10p" class="tab-btn flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-blue-400 bg-blue-600/10 border border-blue-500/20">
            <span class="flex items-center gap-2.5">
              <i data-lucide="file-text" class="w-4 h-4"></i>
              <span class="whitespace-nowrap">10점 단답형 DB</span>
            </span>
            <span id="badge-10p" class="px-1.5 py-0.5 bg-blue-500/20 text-[10px] rounded-md text-blue-300">0</span>
          </button>
          <button type="button" onclick="switchTab('tab-25p')" id="btn-tab-25p" class="tab-btn flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
            <span class="flex items-center gap-2.5">
              <i data-lucide="layers" class="w-4 h-4"></i>
              <span class="whitespace-nowrap">25점 논술형 DB</span>
            </span>
            <span id="badge-25p" class="px-1.5 py-0.5 bg-slate-800 text-[10px] rounded-md text-slate-400">0</span>
          </button>
          <button type="button" onclick="switchTab('tab-practice')" id="btn-tab-practice" class="tab-btn flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition text-slate-400 hover:text-slate-200 hover:bg-slate-800/50">
            <span class="flex items-center gap-2.5">
              <i data-lucide="pen-tool" class="w-4 h-4 text-amber-400"></i>
              <span class="whitespace-nowrap">실전 인출 훈련</span>
            </span>
            <span class="px-1.5 py-0.5 bg-amber-500/20 text-[10px] rounded-md text-amber-400 font-bold">LIVE</span>
          </button>
        </nav>

        <!-- 15대 대분류 필터 -->
        <div class="hidden md:block pt-2">
          <label class="block text-[11px] font-bold text-slate-400 mb-1.5 px-1">15대 표준 분야 필터</label>
          <select id="category-filter" onchange="handleCategoryFilter(this.value)" class="w-full bg-slate-950 border border-slate-800 text-slate-200 text-xs rounded-xl p-2.5 focus:outline-none focus:border-blue-500">
            <option value="ALL">전체 분야 보기 (15대 분야)</option>
            <option value="1. 대기오염개론">1. 대기오염개론</option>
            <option value="2. 연소공학">2. 연소공학</option>
            <option value="3. 기후변화">3. 기후변화</option>
            <option value="4. 지구환경문제">4. 지구환경문제</option>
            <option value="5. 미기상학">5. 미기상학</option>
            <option value="6. 자동차의 오염">6. 자동차의 오염</option>
            <option value="7. 실내공기질 오염">7. 실내공기질 오염</option>
            <option value="8. 다이옥신 및 POPs">8. 다이옥신 및 POPs</option>
            <option value="9. 악취">9. 악취</option>
            <option value="10. VOCs 관리">10. VOCs 관리</option>
            <option value="11. 산업환기">11. 산업환기</option>
            <option value="12. 입자상물질과 처리">12. 입자상물질과 처리기술</option>
            <option value="13. 유해가스와 처리">13. 유해가스와 처리기술</option>
            <option value="14. 공정시험기준">14. 공정시험기준</option>
            <option value="15. 대기환경관계법규">15. 대기환경관계법규</option>
          </select>
        </div>
      </div>

      <!-- 암기 현황 통계 -->
      <div class="hidden md:flex flex-col gap-3 p-3 bg-slate-950/70 rounded-2xl border border-slate-800/80 text-xs mt-3">
        <div class="flex items-center justify-between text-slate-400 font-medium">
          <span>합격 암기 진도율</span>
          <span id="progress-percent" class="font-bold text-blue-400 text-sm">0%</span>
        </div>
        <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden">
          <div id="progress-bar" class="bg-gradient-to-r from-blue-500 to-emerald-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
        </div>
        <div class="flex items-center justify-between pt-1 text-slate-500 text-[11px]">
          <span id="memo-count">0 / 0 문항 완료</span>
          <button type="button" onclick="logout()" class="hover:text-rose-400 transition flex items-center gap-1">
            <i data-lucide="log-out" class="w-3 h-3"></i>
            <span>로그아웃</span>
          </button>
        </div>
      </div>
    </aside>

    <!-- 메인 컨텐츠 영역 -->
    <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
      
      <!-- 상단 툴바 -->
      <header class="h-16 border-b border-slate-800 px-4 md:px-6 flex items-center justify-between shrink-0 bg-slate-900/40 backdrop-blur-md">
        <div class="flex items-center gap-3">
          <h2 id="tab-title" class="text-sm md:text-base font-bold text-white flex items-center gap-2">
            <span>10점 단답형 DB</span>
          </h2>
        </div>

        <div class="flex items-center gap-2">
          <!-- 통합 검색 -->
          <div class="relative hidden sm:block">
            <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
            <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="핵심 키워드/이론/법규 검색..." 
                   class="pl-8 pr-3 py-1.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white focus:outline-none focus:border-blue-500 w-44 transition">
          </div>

          <!-- 새 문항 추가 모달 버튼 -->
          <button type="button" onclick="openModal()" class="flex items-center gap-1.5 px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs font-semibold rounded-lg transition">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            <span class="hidden sm:inline">문항 추가</span>
          </button>

          <!-- 블라인드 암기 모드 -->
          <button type="button" onclick="toggleBlindMode()" id="blind-btn" class="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 transition">
            <i data-lucide="eye-off" class="w-3.5 h-3.5"></i>
            <span>블라인드</span>
          </button>
        </div>
      </header>

      <!-- 모바일 필터 & 검색바 -->
      <div class="md:hidden p-2.5 border-b border-slate-800 bg-slate-900/50 flex gap-2">
        <select onchange="handleCategoryFilter(this.value)" class="flex-1 bg-slate-950 border border-slate-800 text-slate-300 text-xs rounded-lg p-1.5">
          <option value="ALL">전체 분야 보기</option>
          <option value="1. 대기오염개론">1. 대기오염개론</option>
          <option value="2. 연소공학">2. 연소공학</option>
          <option value="3. 기후변화">3. 기후변화</option>
          <option value="4. 지구환경문제">4. 지구환경문제</option>
          <option value="5. 미기상학">5. 미기상학</option>
          <option value="6. 자동차의 오염">6. 자동차의 오염</option>
          <option value="7. 실내공기질 오염">7. 실내공기질 오염</option>
          <option value="8. 다이옥신 및 POPs">8. 다이옥신 및 POPs</option>
          <option value="9. 악취">9. 악취</option>
          <option value="10. VOCs 관리">10. VOCs 관리</option>
          <option value="11. 산업환기">11. 산업환기</option>
          <option value="12. 입자상물질과 처리">12. 입자상물질과 처리</option>
          <option value="13. 유해가스와 처리">13. 유해가스와 처리</option>
          <option value="14. 공정시험기준">14. 공정시험기준</option>
          <option value="15. 대기환경관계법규">15. 대기환경관계법규</option>
        </select>
        <input type="text" oninput="handleSearch(this.value)" placeholder="검색..." 
               class="w-28 px-2 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-xs text-white">
      </div>

      <!-- 10점형 단답 서브노트 -->
      <section id="tab-10p" class="tab-content flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
        <div id="list-10p" class="space-y-4"></div>
      </section>

      <!-- 25점형 논술 DB -->
      <section id="tab-25p" class="tab-content hidden flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
        <div id="list-25p" class="space-y-4"></div>
      </section>

      <!-- 실전 답안 인출 훈련 탭 -->
      <section id="tab-practice" class="tab-content hidden flex-1 overflow-y-auto p-4 md:p-6 flex flex-col">
        <div class="max-w-4xl w-full mx-auto space-y-4 flex-1 flex flex-col">
          
          <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg flex items-center justify-between">
            <div>
              <span class="text-[11px] font-bold text-amber-400 block mb-1">⚡ 실전 답안 인출 트레이닝 (실전 답안지 규격)</span>
              <h3 id="train-q-title" class="text-sm md:text-base font-bold text-white">문제를 선택하여 실전 답안 인출을 시작하세요.</h3>
            </div>
            <button type="button" onclick="loadRandomQuestion()" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5 shrink-0">
              <i data-lucide="shuffle" class="w-3.5 h-3.5"></i>
              <span>랜덤 출제</span>
            </button>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 flex-1">
            <!-- 답안 작성 창 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                  <i data-lucide="edit-3" class="w-3.5 h-3.5 text-blue-400"></i> 내 실전 답안 (개조식/단답식 작성)
                </span>
                <span class="text-[10px] text-slate-500">실전 답안지 양식</span>
              </div>
              <textarea id="user-practice-input" placeholder="1. 개조식 정의&#10;2. 핵심 반응식/원리&#10;3. 공학적 대책 및 시사 결론" 
                        class="w-full flex-1 min-h-[260px] bg-slate-950 border border-slate-800 rounded-xl p-3.5 text-xs text-slate-200 font-mono focus:outline-none focus:border-blue-500 leading-relaxed"></textarea>
              <div class="mt-3 flex justify-end">
                <button type="button" onclick="compareAnswer()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl text-xs font-bold transition flex items-center gap-1.5">
                  <i data-lucide="check" class="w-3.5 h-3.5"></i>
                  <span>모범답안 대조 & 키워드 채점</span>
                </button>
              </div>
            </div>

            <!-- 모범답안 비교 창 -->
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col">
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold text-slate-300 flex items-center gap-1.5">
                  <i data-lucide="book-open" class="w-3.5 h-3.5 text-amber-400"></i> 표준 모범 답안
                </span>
                <span id="train-q-type" class="px-2 py-0.5 bg-slate-800 text-[10px] text-blue-400 rounded">대기분야</span>
              </div>
              <div id="model-answer-box" class="w-full flex-1 min-h-[260px] bg-slate-950/80 border border-slate-800 rounded-xl p-3.5 text-xs text-slate-400 font-mono overflow-y-auto leading-relaxed">
                좌측에서 답안을 작성한 후 [모범답안 대조] 버튼을 누르면 적중률과 핵심 키워드가 표시됩니다.
              </div>
            </div>
          </div>

        </div>
      </section>

    </main>
  </div>

  <!-- 문항 추가 모달 -->
  <div id="item-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-white flex items-center gap-2">
          <i data-lucide="plus-circle" class="w-4 h-4 text-blue-400"></i>
          <span>새 서브노트 문항 등록</span>
        </h3>
        <button type="button" onclick="closeModal()" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="space-y-3 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-slate-400 mb-1">유형</label>
            <select id="modal-type" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white">
              <option value="10p">10점 단답형</option>
              <option value="25p">25점 논술형</option>
            </select>
          </div>
          <div>
            <label class="block text-slate-400 mb-1">15대 대분류</label>
            <select id="modal-category" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white">
              <option value="1. 대기오염개론">1. 대기오염개론</option>
              <option value="2. 연소공학">2. 연소공학</option>
              <option value="3. 기후변화">3. 기후변화</option>
              <option value="4. 지구환경문제">4. 지구환경문제</option>
              <option value="5. 미기상학">5. 미기상학</option>
              <option value="6. 자동차의 오염">6. 자동차의 오염</option>
              <option value="7. 실내공기질 오염">7. 실내공기질 오염</option>
              <option value="8. 다이옥신 및 POPs">8. 다이옥신 및 POPs</option>
              <option value="9. 악취">9. 악취</option>
              <option value="10. VOCs 관리">10. VOCs 관리</option>
              <option value="11. 산업환기">11. 산업환기</option>
              <option value="12. 입자상물질과 처리">12. 입자상물질과 처리</option>
              <option value="13. 유해가스와 처리">13. 유해가스와 처리</option>
              <option value="14. 공정시험기준">14. 공정시험기준</option>
              <option value="15. 대기환경관계법규">15. 대기환경관계법규</option>
            </select>
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">문제 제목</label>
          <input type="text" id="modal-title" placeholder="문제명을 입력하세요" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white">
        </div>
        <div>
          <label class="block text-slate-400 mb-1">개조식 서론 정의</label>
          <textarea id="modal-intro" rows="2" placeholder="개조식 서론 요약" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white"></textarea>
        </div>
        <div>
          <label class="block text-slate-400 mb-1">핵심 본론 (*키워드는 [ ] 로 감싸면 블라인드 처리, 표는 | 구문 지원)</label>
          <textarea id="modal-body" rows="4" placeholder="예: 1. 주 반응식: [4NO + 4NH3 + O2 -> 4N2 + 6H2O]" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-white"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg">취소</button>
          <button type="button" onclick="saveNewItem()" class="px-4 py-2 bg-blue-600 text-white font-bold rounded-lg">저장</button>
        </div>
      </div>
    </div>

  body: '1. [확산연소 (Diffusion)]:\n  - 연료와 공기를 [개별 분사하여 계면에서 혼합·연소].\n  - 장점: [역화(Flashback) 위험이 없어 안전].\n  - 단점: 국소 고온으로 인한 [Thermal NOx 및 매연 발생 증가].\n2. [예혼합연소 (Premixed)]:\n  - 연소실 유입 전 [이론공연비로 사전 균일 혼합 후 연소].\n  - 장점: 균일 화염으로 [매연 미발생 및 고효율 저공기비 운전].\n  - 단점: 연소속도가 분출속도 초과 시 [역화 위험 상존].',
  memorized: false
},
{
  id: 'c3-03',
  type: '10p',
  category: '3. 기후변화',
  title: '온실가스 산정 Tier(1, 2, 3) 체계 및 활동자료 모니터링 유형',
  intro: 'IPCC 지침 및 배출권거래제 산정 기준에 따른 온실가스 배출량 산정 등급(정확도) 및 데이터 수집 체계.',
  body: '1. [Tier 산정 등급 체계]:\n  - [Tier 1]: IPCC 기본 [디폴트(Default) 배출계수] 적용 (정확도 최저).\n  - [Tier 2]: [국가 고유(Country-specific) 배출계수] 개발·적용.\n  - [Tier 3]: 사업장 고유 [실측 탄소함량 및 연속측정 데이터] 적용 (정확도 최고).\n2. [활동자료 3대 모니터링 유형]:\n  - [유형 A]: 교정 검정된 유량계·계측기로 [직접 연속 측정].\n  - [유형 B]: 세금계산서, 거래명세서 등 [상거래 증빙 자료].\n  - [유형 C]: 가동시간 및 재고 변동 기반 [공학적 추정].',
  memorized: false
},
{
  id: 'c4-02',
  type: '10p',
  category: '4. 지구환경문제',
  title: '몬트리올 의정서와 키갈리 개정서(Kigali Amendment)의 냉매 규제 로드맵',
  intro: '성층권 오존층 파괴 억제에서 지구온난화지수(GWP) 감축으로 진화한 국제 냉매물질 규제 협약.',
  body: '1. [몬트리올 의정서 (1987)]:\n  - 대상: [CFCs(염화불화탄소), HCFCs] 등 오존파괴지수(ODP) 함유 물질 전면 퇴출.\n2. [키갈리 개정서 (2016)]:\n  - 대상: ODP는 0이나 GWP가 수천 배에 달하는 [HFCs(수소불화탄소)를 온실가스로 지정 및 단계적 감축].\n  - 목표: 2045년까지 HFCs 소비량을 [기준치 대비 80~85% 단계적 삭감].\n  - 대책: HFOs(수소불화올레핀), CO₂, 암모니아 등 [자연/로우(Low)-GWP 냉매로의 대체 전환].',
  memorized: false
},
{
  id: 'c5-03',
  type: '10p',
  category: '5. 미기상학',
  title: '기온역전(Inversion) 4대 유형의 발생 원인 및 특성',
  intro: '고도 상승에 따라 기온이 상승하여 대기가 극도로 안정화되고 오염물질이 지표에 정체되는 현상.',
  body: '1. [방사역전 (지표 복사냉각)]:\n  - [맑고 바람 없는 밤], 지표면 급격한 열방출로 지표층 형성 (일출 후 급속 소멸).\n2. [침강역전 (고기압 중심)]:\n  - 고기압 중심부에서 [공기가 단열 압축 승온]되며 상층에 뚜껑처럼 역전층 형성 (장기 지속 광역 오염).\n3. [전선역전 (전선 통과)]:\n  - 온난전선 계면에서 [따뜻한 공기가 찬 공기 위를 타고 오를 때] 발생.\n4. [이류역전 (해무 등)]:\n  - 따뜻하고 습한 공기가 [차가운 해수면이나 지표면을 통과할 때] 하부 냉각으로 형성.',
  memorized: false
},
{
  id: 'c6-02',
  type: '10p',
  category: '6. 자동차의 오염',
  title: '디젤차 배출가스 후처리장치 DPF와 SCR의 결합 배치 및 PM·NOx 동시 저감',
  intro: '경유차 배출 유해물질인 입자상물질(PM)과 질소산화물(NOx)을 동시 90% 이상 제거하기 위한 통합 후처리 시스템.',
  body: '1. [DPF (매연포집필터)]:\n  - 다공성 세라믹 월플로우(Wall-Flow) 필터로 [PM을 90% 이상 물리적 포집] 후 고온 산화 재생.\n2. [SCR (선택적 환원촉매)]:\n  - 요소수(Urea)를 분사하여 암모니아(NH₃)로 열분해 후 [NOx를 N₂와 H₂O로 무해화].\n3. [통합 배치 (DOC + DPF + SCR + ASC)]:\n  - [DOC]에서 NO₂를 생성해 DPF 재생 촉진 → [DPF] PM 제거 → [SCR] 탈질 → [ASC] 잉여 NH₃ 슬립 차단.',
  memorized: false
},
{
  id: 'c7-02',
  type: '10p',
  category: '7. 실내공기질 오염',
  title: '실내 라돈(Rn-222)의 유입 경로, 건강 영향 및 저감 대책',
  intro: '토양이나 암석 속 우라늄-238 붕괴 사슬에서 생성되는 무색·무취의 자연 방사성 불활성 기체 오염물질.',
  body: '1. [유입 경로]: [지하 토양·암석의 미세 균열], 건축자재(석고보드, 콘크리트), 지하수 통로.\n2. [인체 건강 영향]: 흡입 시 폐포 내 침적되어 알파(α)선 방출, [비흡연자 폐암 발병 원인 1위].\n3. [공학적 저감 대책]:\n  - [토양라돈배출관(SSDV)]: 기초 바닥 하부에 다공관을 매립하여 외부로 강제 배출.\n  - [바닥 및 벽체 차폐 실링]: 틈새 크랙 탄성 실링제 완전 도포.\n  - [기계환기]: 상시 양압 환기로 실내 유입 차단.',
  memorized: false
},
{
  id: 'c8-02',
  type: '10p',
  category: '8. 다이옥신 및 POPs',
  title: '스톡홀름협약(Stockholm Convention) 12대 잔류성유기오염물질(POPs)의 특성',
  intro: '체내 잔류성 및 생물 농축성이 강하고 장거리 이동성이 있는 유독성 유기오염물질을 근절하기 위한 국제 협약.',
  body: '1. [POPs의 4대 공통 물리화학적 특성]:\n  - [고독성]: 저농도에서도 기형아 출산, 발암, 내분비계 교란 유발.\n  - [생물농축성(Bioaccumulation)]: 지질 친화성(높은 Kow)으로 지방 조직 농축.\n  - [잔류성(Persistence)]: 환경 중 반감기가 수개월~수십 년으로 난분해성.\n  - [장거리 이동성(LRT)]: 대기 순환을 타고 극지방까지 확산(메뚜기 효과, Grasshopper Effect).\n2. [대표 규제 물질]: [의도적 생산(DDT, PCB 등 10종)] + [비의도적 부산물(PCDDs, PCDFs 2종)].',
  memorized: false
},
{
  id: 'c9-02',
  type: '10p',
  category: '9. 악취',
  title: '바이오필터(Biofilter) 탈취공정의 원리, 미생물 담체 조건 및 운전 관리',
  intro: '악취 가스를 미생물이 서식하는 다공성 담체층에 통과시켜 미생물의 대사작용을 통해 무해한 무기물로 생분해하는 친환경 탈취 기술.',
  body: '1. [정화 메커니즘]: [흡착/흡수(기상→액막)] → [미생물 섭취 및 생분해(CO₂, H₂O, SO₄²⁻, NO₃⁻)].\n2. [담체(Media) 요구조건]: 높은 비표면적, 우수한 수분보유력, 통기성, 압력손실 최소화(우드칩, 피트모스, 세라믹).\n3. [3대 핵심 운전 지배인자]:\n  - [수분 함유율]: [40 ~ 60%] 상시 유지 (건조 시 미생물 사멸, 과습 시 혐기성화 차압 급증).\n  - [pH 제어]: [6.5 ~ 7.5 중성] 유지 (황화수소 분해 시 황산화로 pH 급감 주의).\n  - [공탑체류시간(EBRT)]: 통상 [20 ~ 40초] 확보.',
  memorized: false
},
{
  id: 'c10-02',
  type: '10p',
  category: '10. VOCs 관리',
  title: '활성탄 흡착탑(Adsorber) 파과곡선(Breakthrough Curve) 및 파과점(Breakthrough Point)',
  intro: '고정층 활성탄 흡착탑에서 시간에 따른 출구 농도의 변화 궤적과 흡착대의 이동 및 재생 주기를 결정하는 핵심 설계 인자.',
  body: '1. [파과곡선 정의 및 형태]:\n  - 흡착탑 통과 시간에 따른 [출구 농도 C/C₀의 비 S자형(Sigmoid) 곡선].\n2. [핵심 지점 분석]:\n  - [파과점(Breakthrough Point, tb)]: 출구 농도가 [배출허용기준치(보통 C/C₀ = 0.05~0.1)]에 도달한 시점으로 즉시 재생/교체 필요.\n  - [포화점(Saturation Point, ts)]: 출구 농도가 유입 농도와 같아져([C/C₀ = 1.0]) 흡착능력이 완전 상실된 시점.\n  - [흡착대(MTZ, Mass Transfer Zone)]: 활성탄 층 내에서 실제 흡착 물질전달이 활발히 일어나는 유효 층 두께.',
  memorized: false
},
{
  id: 'c11-02',
  type: '10p',
  category: '11. 산업환기',
  title: '국소배기장치 후드(Hood)의 유입계수(Ce)와 압력손실(h_e) 산정식',
  intro: '기류가 후드 개구부로 흡인될 때 발생하는 베나 콘트랙타(Vena Contracta) 축류 손실을 정량화한 환기역학 설계 인자.',
  body: '1. [유입계수(Ce) 및 정압비(F)]:\n  - [Ce = √(1 / (1 + F)) = V / V_theoretical]\n  - 벨마우스(Bell-mouth) 후드: Ce ≈ 0.98 (손실 극소)\n  - 플랜지 없는 직관 후드: Ce ≈ 0.72 (손실 과대)\n2. [후드 압력손실(h_e) 산정식]:\n  - [h_e = F · VP = ((1 - Ce²) / Ce²) · VP]\n  - VP(속도압) = (V / 4.04)² (mmH₂O at 21℃, 1atm)',
  memorized: false
},
{
  id: 'c12-03',
  type: '10p',
  category: '12. 입자상물질과 처리',
  title: '원심력 집진기(Cyclone) 절단입경(d_pc) 수식 및 분리효율 향상 설계조건',
  intro: '싸이클론 내에서 50%의 집진효율을 나타내는 한계 입경(Cut-size)의 공학적 지배인자 고찰.',
  body: '1. [Lapple의 절단입경 수식]:\n  - [d_pc = √{ (9 · μ · W) / (2 · π · N_e · V_i · (ρ_p - ρ)) }]\n  - μ: 점성계수, W: 입구 폭, N_e: 유효 회전수, V_i: 유입속도, ρ_p: 입자밀도\n2. [효율 향상(절단입경 소경화) 3대 설계 조건]:\n  - [유입폭(W) 축소]: 분리 대상 입자의 반경 방향 이동 거리 단축.\n  - [유효 회전수(N_e) 증가]: 원통부 길이를 길게 하여 체류시간 확보.\n  - [유입속도(V_i) 증대]: 통상 [15 ~ 20 m/s] 최적 (단, 25 m/s 초과 시 재비산 유발).',
  memorized: false
},
{
  id: 'c13-02',
  type: '10p',
  category: '13. 유해가스와 처리',
  title: '습식 충전탑(Packed Tower) 편류현상(Channeling) 원인 및 방지대책',
  intro: '흡수탑 내부 충전층에서 세정액이 한쪽으로 치우쳐 흘러 기-액 접촉 면적이 급감하고 흡수효율이 저하되는 현상.',
  body: '1. [발생 원인]:\n  - 충전물 불균일 충진, [탑경 대비 충전물 크기 과대 (D/d < 8~10)].\n  - 세정액 초기 분배 불량 및 [재분배기(Redistributor) 미설치].\n2. [공학적 방지대책]:\n  - [탑경-충전물 비 준수]: [탑경/충전물 직경 비(D/d) ≥ 10~15] 이상 확보.\n  - [액 재분배기 설치]: 충전층 높이가 탑경의 [3배(또는 3~5m)]마다 중간 재분배기 설치.\n  - [다공 노즐 정밀 배치]: 분무 노즐 분사각을 겹치게 배치하여 데드존(Dead-zone) 배제.',
  memorized: false
},
{
  id: 'c14-02',
  type: '10p',
  category: '14. 공정시험기준',
  title: '굴뚝 배출가스 등속흡인(Isokinetic Sampling)의 원리 및 오차 발생 기전',
  intro: '배출가스 중 먼지 채취 시 노즐 흡입 유속과 가스 본류 유속을 동일하게 일치시켜 관성 분리에 따른 오차를 방지하는 시료채취 원칙.',
  body: '1. [등속흡인 조건]: [V_n(노즐 유속) = V_s(가스 본류 유속)] (등속계수: [95 ~ 110% 유지]).\n2. [등속 미달 시 (V_n < V_s)]:\n  - 유선이 노즐 바깥으로 휘어짐 → 대립자가 관성력으로 노즐 내 추가 유입 → [측정 농도가 실제보다 과대평가].\n3. [등속 초과 시 (V_n > V_s)]:\n  - 유선이 노즐 내부로 집중 → 대립자가 관성력으로 빗겨나감 → [측정 농도가 실제보다 과소평가].',
  memorized: false
},
{
  id: 'c15-03',
  type: '10p',
  category: '15. 대기환경관계법규',
  title: '통합환경관리제도(IPPC)의 허가배출기준 설정 원리 및 최적가용기법(BAT)',
  intro: '수질·대기 등 매체별 분절 규제를 벗어나 사업장 단위로 통합 검토하고 환경성과 경제성을 갖춘 최적가용기법을 적용하는 선진 허가 체계.',
  body: '1. [최적가용기법 (BAT, Best Available Techniques)]:\n  - 환경 오염을 최소화할 수 있는 [기술적 우수성]과 설치·운영이 가능한 [상업적 경제성]을 동시에 갖춘 기법.\n2. [최대허용배출기준 및 허가배출기준 산정]:\n  - 최대허용배출기준: 법적 상한선(법정 배출허용기준).\n  - [허가배출기준]: 사업장 주변 [환경영향 수용체 용량 + BAT 적용 기준]을 연계하여 사업장별 맞춤형으로 엄격 설정.',
  memorized: false
}    
    ];

    var currentDB = [];
    try {
      var saved = localStorage.getItem('pe_air_master_v3');
      currentDB = saved ? JSON.parse(saved) : masterExamDB;
    } catch(e) {
      currentDB = masterExamDB;
    }

    var isBlind = false;
    var activeCategory = 'ALL';

    function checkPin() {
      var pin = document.getElementById('pin-input').value.replace(/\s+/g, '');
      if (pin === '8234') {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('main-app').classList.remove('hidden');
        document.getElementById('login-err').classList.add('hidden');
        initApp();
      } else {
        document.getElementById('login-err').classList.remove('hidden');
      }
    }

    document.getElementById('pin-input').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') checkPin();
    });

    function logout() {
      document.getElementById('pin-input').value = '';
      document.getElementById('login-err').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
      document.getElementById('main-app').classList.add('hidden');
    }

    function initApp() {
      renderBadges();
      renderItems();
      updateProgress();
      if (window.lucide) lucide.createIcons();
    }

    function saveDB() {
      try {
        localStorage.setItem('pe_air_master_v3', JSON.stringify(currentDB));
      } catch(e) {}
      renderBadges();
      renderItems();
      updateProgress();
    }

    function renderBadges() {
      var count10 = currentDB.filter(function(x) { return x.type === '10p'; }).length;
      var count25 = currentDB.filter(function(x) { return x.type === '25p'; }).length;
      document.getElementById('badge-10p').innerText = count10;
      document.getElementById('badge-25p').innerText = count25;
    }

    function formatBodyText(text) {
      if (!text) return '';
      var lines = text.split('\n');
      var html = '';
      var inTable = false;
      var tableHtml = '';

      for (var i = 0; i < lines.length; i++) {
        var line = lines[i].trim();
        if (line.startsWith('|') && line.endsWith('|')) {
          if (!inTable) {
            inTable = true;
            tableHtml = '<div class="overflow-x-auto my-3"><table class="w-full text-left text-xs border border-slate-800 rounded-lg overflow-hidden">';
          }
          var cells = line.split('|').filter(function(c, idx, arr) { return idx > 0 && idx < arr.length - 1; });
          if (line.indexOf('---') !== -1 || line.indexOf(':---') !== -1) continue;
          
          var isHeader = (tableHtml.indexOf('<tbody>') === -1);
          if (isHeader) {
            tableHtml += '<thead class="bg-slate-950 text-slate-300 font-bold"><tr>';
            cells.forEach(function(cell) { tableHtml += '<th class="p-2.5 border-b border-slate-800">' + parseBlind(cell.trim()) + '</th>'; });
            tableHtml += '</tr></thead><tbody>';
          } else {
            tableHtml += '<tr class="border-b border-slate-800/60 hover:bg-slate-800/30">';
            cells.forEach(function(cell) { tableHtml += '<td class="p-2.5 text-slate-300">' + parseBlind(cell.trim()) + '</td>'; });
            tableHtml += '</tr>';
          }
        } else {
          if (inTable) {
            inTable = false;
            tableHtml += '</tbody></table></div>';
            html += tableHtml;
            tableHtml = '';
          }
          if (line.length > 0) {
            html += '<p class="mb-1.5 leading-relaxed">' + parseBlind(line) + '</p>';
          }
        }
      }
      if (inTable) {
        tableHtml += '</tbody></table></div>';
        html += tableHtml;
      }
      return html;
    }

    function parseBlind(str) {
      return str.replace(/\[(.*?)\]/g, function(match, p1) {
        return '<span class="blind-target font-semibold text-amber-300 underline decoration-amber-500/40 ' + (isBlind ? 'blind-blur' : '') + '" onclick="toggleWord(this)">' + p1 + '</span>';
      });
    }

    function toggleWord(el) {
      if (isBlind) el.classList.toggle('revealed');
    }

    function toggleBlindMode() {
      isBlind = !isBlind;
      var targets = document.querySelectorAll('.blind-target');
      targets.forEach(function(el) {
        if (isBlind) {
          el.classList.add('blind-blur');
          el.classList.remove('revealed');
        } else {
          el.classList.remove('blind-blur', 'revealed');
        }
      });
      var btn = document.getElementById('blind-btn');
      btn.classList.toggle('bg-blue-600', isBlind);
      btn.classList.toggle('border-blue-500', isBlind);
    }

    function toggleMemorized(id) {
      var item = currentDB.find(function(x) { return x.id === id; });
      if (item) {
        item.memorized = !item.memorized;
        saveDB();
      }
    }

    function deleteItem(id) {
      if (confirm('이 문항을 삭제하시겠습니까?')) {
        currentDB = currentDB.filter(function(x) { return x.id !== id; });
        saveDB();
      }
    }

    function handleCategoryFilter(cat) {
      activeCategory = cat;
      renderItems(document.getElementById('search-input').value);
    }

    function renderItems(filterQuery) {
      var query = (filterQuery || '').toLowerCase();
      var list10 = document.getElementById('list-10p');
      var list25 = document.getElementById('list-25p');
      list10.innerHTML = '';
      list25.innerHTML = '';

      var filtered = currentDB.filter(function(item) {
        var matchCat = (activeCategory === 'ALL' || item.category === activeCategory);
        var matchQuery = (item.title && item.title.toLowerCase().indexOf(query) !== -1) || 
                         (item.category && item.category.toLowerCase().indexOf(query) !== -1) || 
                         (item.body && item.body.toLowerCase().indexOf(query) !== -1);
        return matchCat && matchQuery;
      });

      filtered.forEach(function(item) {
        var card = document.createElement('article');
        card.className = 'bg-slate-900 border ' + (item.memorized ? 'border-emerald-500/40 bg-slate-900/60' : 'border-slate-800') + ' rounded-2xl p-5 hover:border-slate-700 transition space-y-3';
        
        card.innerHTML = 
          '<div class="flex items-center justify-between">' +
            '<div class="flex items-center gap-2">' +
              '<span class="px-2.5 py-1 text-[11px] font-bold rounded-lg border bg-blue-500/10 text-blue-400 border-blue-500/20">' + item.category + '</span>' +
              (item.memorized ? '<span class="px-2 py-0.5 bg-emerald-500/20 text-emerald-400 text-[10px] font-bold rounded">암기완료</span>' : '') +
            '</div>' +
            '<div class="flex items-center gap-1.5">' +
              '<button type="button" onclick="loadToTrainer(\'' + item.id + '\')" title="인출 훈련으로 이동" class="p-1.5 rounded-lg text-slate-400 hover:text-amber-400 hover:bg-slate-800 transition">' +
                '<i data-lucide="pen-tool" class="w-4 h-4"></i>' +
              '</button>' +
              '<button type="button" onclick="toggleMemorized(\'' + item.id + '\')" title="암기 체크" class="p-1.5 rounded-lg ' + (item.memorized ? 'text-emerald-400 bg-emerald-500/10' : 'text-slate-500 hover:text-slate-300') + ' transition">' +
                '<i data-lucide="' + (item.memorized ? 'check-circle-2' : 'circle') + '" class="w-4 h-4"></i>' +
              '</button>' +
              '<button type="button" onclick="deleteItem(\'' + item.id + '\')" class="p-1.5 text-slate-600 hover:text-rose-400 transition">' +
                '<i data-lucide="trash-2" class="w-3.5 h-3.5"></i>' +
              '</button>' +
            '</div>' +
          '</div>' +
          '<h3 class="text-sm md:text-base font-bold text-white leading-snug">' + item.title + '</h3>' +
          '<div class="text-xs space-y-2.5 text-slate-300 font-mono leading-relaxed">' +
            (item.intro ? 
              '<div class="p-3 bg-slate-950/80 rounded-xl border border-slate-800/80">' +
                '<p class="text-slate-400 font-semibold mb-1 text-[11px]">[개조식 서론 정의]</p>' +
                '<p class="text-slate-200">' + parseBlind(item.intro) + '</p>' +
              '</div>' : '') +
            '<div class="p-3 bg-slate-950/40 rounded-xl border border-slate-800/40 space-y-1">' +
              '<p class="text-slate-400 font-semibold mb-1.5 text-[11px]">[핵심 본론 및 차별화 결론]</p>' +
              formatBodyText(item.body) +
            '</div>' +
          '</div>';

        if (item.type === '10p') {
          list10.appendChild(card);
        } else {
          list25.appendChild(card);
        }
      });

      if (window.lucide) lucide.createIcons();
    }

    function handleSearch(val) { renderItems(val); }

    function updateProgress() {
      if (currentDB.length === 0) return;
      var count = currentDB.filter(function(x) { return x.memorized; }).length;
      var pct = Math.round((count / currentDB.length) * 100);
      document.getElementById('progress-percent').innerText = pct + '%';
      document.getElementById('progress-bar').style.width = pct + '%';
      document.getElementById('memo-count').innerText = count + ' / ' + currentDB.length + ' 문항 완료';
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(function(el) { el.classList.add('hidden'); });
      document.querySelectorAll('.tab-btn').forEach(function(el) {
        el.classList.remove('text-blue-400', 'bg-blue-600/10', 'border', 'border-blue-500/20');
        el.classList.add('text-slate-400');
      });

      document.getElementById(tabId).classList.remove('hidden');
      var activeBtn = document.getElementById('btn-' + tabId);
      activeBtn.classList.add('text-blue-400', 'bg-blue-600/10', 'border', 'border-blue-500/20');
      activeBtn.classList.remove('text-slate-400');

      var titleMap = {
        'tab-10p': '10점 단답형 DB',
        'tab-25p': '25점 논술형 DB',
        'tab-practice': '실전 답안 인출 훈련'
      };
      document.getElementById('tab-title').innerText = titleMap[tabId];
    }

    function openModal() { document.getElementById('item-modal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('item-modal').classList.add('hidden'); }

    function saveNewItem() {
      var title = document.getElementById('modal-title').value.trim();
      if (!title) { alert('제목을 입력하세요'); return; }

      var newItem = {
        id: 'item-' + Date.now(),
        type: document.getElementById('modal-type').value,
        category: document.getElementById('modal-category').value,
        title: title,
        intro: document.getElementById('modal-intro').value.trim(),
        body: document.getElementById('modal-body').value.trim(),
        memorized: false
      };
      currentDB.unshift(newItem);
      saveDB();
      closeModal();
      document.getElementById('modal-title').value = '';
      document.getElementById('modal-intro').value = '';
      document.getElementById('modal-body').value = '';
    }

    var activeTrainingItem = null;

    function loadRandomQuestion() {
      var rand = currentDB[Math.floor(Math.random() * currentDB.length)];
      setupTrainer(rand);
    }

    function loadToTrainer(id) {
      var item = currentDB.find(function(x) { return x.id === id; });
      if (item) {
        switchTab('tab-practice');
        setupTrainer(item);
      }
    }

    function setupTrainer(item) {
      activeTrainingItem = item;
      document.getElementById('train-q-title').innerText = item.title;
      document.getElementById('train-q-type').innerText = item.category;
      document.getElementById('user-practice-input').value = '';
      document.getElementById('model-answer-box').innerHTML = 
        '<div class="text-slate-500 flex flex-col items-center justify-center h-48 space-y-2">' +
          '<i data-lucide="lock" class="w-6 h-6 text-slate-600"></i>' +
          '<span>답안을 작성하신 후 채점 버튼을 누르면 모범답안과 키워드 적중률이 표시됩니다.</span>' +
        '</div>';
      if (window.lucide) lucide.createIcons();
    }

    function compareAnswer() {
      if (!activeTrainingItem) {
        alert('먼저 상단의 [랜덤 출제]를 눌러 문제를 선택하세요.');
        return;
      }
      var userText = document.getElementById('user-practice-input').value.trim();
      var box = document.getElementById('model-answer-box');

      var targetKeywords = [];
      var regex = /\[(.*?)\]/g;
      var match;
      var fullText = (activeTrainingItem.intro || '') + ' ' + (activeTrainingItem.body || '');
      while ((match = regex.exec(fullText)) !== null) {
        targetKeywords.push(match[1]);
      }

      var hitCount = 0;
      targetKeywords.forEach(function(kw) {
        var cleanKw = kw.replace(/[^a-zA-Z0-9가-힣]/g, '');
        if (cleanKw.length > 1 && userText.indexOf(cleanKw) !== -1) {
          hitCount++;
        }
      });

      var scorePct = targetKeywords.length > 0 ? Math.round((hitCount / targetKeywords.length) * 100) : 100;

      box.innerHTML = 
        '<div class="mb-3 p-3 bg-blue-950/40 border border-blue-800/40 rounded-xl">' +
          '<div class="flex items-center justify-between mb-1">' +
            '<span class="font-bold text-blue-400">📊 핵심 키워드 적중률</span>' +
            '<span class="text-sm font-bold ' + (scorePct >= 70 ? 'text-emerald-400' : 'text-amber-400') + '">' + scorePct + '% (' + hitCount + '/' + targetKeywords.length + '개)</span>' +
          '</div>' +
          '<p class="text-[11px] text-slate-400">실전 답안 누락 방지를 위해 아래 표준 모범답안과 키워드를 대조하세요.</p>' +
        '</div>' +
        '<div class="space-y-2 text-xs">' +
          (activeTrainingItem.intro ? 
            '<div class="p-2.5 bg-slate-900 rounded-lg border border-slate-800">' +
              '<span class="text-slate-400 font-bold block mb-1">[개조식 서론]</span>' +
              '<p class="text-slate-200">' + activeTrainingItem.intro + '</p>' +
            '</div>' : '') +
          '<div class="p-2.5 bg-slate-900 rounded-lg border border-slate-800">' +
            '<span class="text-slate-400 font-bold block mb-1">[본론 및 결론 모범답안]</span>' +
            formatBodyText(activeTrainingItem.body) +
          '</div>' +
        '</div>';
      
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', function() {
      if (window.lucide) lucide.createIcons();
    });
  </script>
</body>
</html>
